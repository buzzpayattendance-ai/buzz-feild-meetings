<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#191E29"><title>Buzz Field</title><link rel="manifest" href="manifest.webmanifest"><style>:root{--n:#191E29;--b:#132D46;--a:#2CFFCC;--g:#31C195;--c:#202735;--l:#344052}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,var(--n),var(--b));color:#fff;font-family:Arial,sans-serif;min-height:100vh}.app{max-width:720px;margin:auto;padding:16px 13px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.brand{font-weight:900;font-size:20px}.brand span{color:var(--a)}button{border:0;border-radius:12px;padding:12px 15px;font-weight:700}.primary{background:var(--a);color:#10201e}.secondary{background:var(--c);color:#fff;border:1px solid var(--l)}.card{background:rgba(32,39,55,.94);border:1px solid var(--l);border-radius:18px;padding:15px;margin-bottom:13px}h1{font-size:24px;margin:7px 0}.muted{color:#9da7b4;font-size:13px}.grid,.filters{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:#cbd2db;font-weight:700;margin-bottom:5px}input,textarea,select{width:100%;background:#151b25;color:#fff;border:1px solid var(--l);border-radius:11px;padding:12px;font:inherit;outline:0}textarea{min-height:95px;resize:vertical}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:12px}.meeting{cursor:pointer}.meeting h3{margin:0 0 5px}.pill{display:inline-block;padding:5px 8px;border-radius:20px;background:#2cFFcc1f;color:var(--a);font-size:11px;font-weight:700;margin:8px 5px 0 0}.hidden{display:none}.error{color:#ff9b9b;font-size:13px}.success{color:var(--a);font-size:13px}.empty{text-align:center;padding:25px;color:#9da7b4}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login .card{width:100%;max-width:420px}.logo{font-size:28px;font-weight:900}.logo span{color:var(--a)}@media(max-width:520px){.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.actions button{flex:1}}</style></head><body>
<div id="login" class="login"><div class="card"><div class="logo">BUZZ <span>FIELD</span></div><div class="muted">Field meeting management</div><br><label>Passcode</label><input id="pass" type="password" inputmode="numeric"><div id="le" class="error"></div><button class="primary" style="width:100%;margin-top:12px" onclick="login()">Open App</button></div></div>
<div id="app" class="app hidden"><div class="top"><div class="brand">BUZZ <span>FIELD</span><div class="muted" id="who"></div></div><button class="secondary" onclick="logout()">Lock</button></div><section id="home"><div class="card"><div class="muted">FIELD MEETINGS</div><h1>Keep every meeting in one place.</h1><button class="primary" onclick="formView()">+ New Meeting</button></div><div class="card"><div class="filters"><input id="search" placeholder="Search business or person" oninput="render()"><select id="filter" onchange="render()"><option value="">All meetings</option><option>Me</option><option>Noman</option><option>Both</option></select></div></div><div id="status" class="muted"></div><div id="list"></div></section>
<section id="form" class="hidden"><div class="card"><div class="muted">NEW FIELD MEETING</div><h1>Meeting details</h1><form onsubmit="save(event)"><div class="grid"><div class="full"><label>Business Name *</label><input id="business" required></div><div><label>Person Met</label><input id="person"></div><div><label>Meeting Date</label><input id="date" type="date"></div><div><label>Contact</label><input id="contact" type="tel"></div><div><label>Other Contact</label><input id="other" type="tel"></div><div class="full"><label>Met By</label><select id="met"><option>Me</option><option>Noman</option><option>Both</option></select></div><div class="full"><label>What Was Discussed</label><textarea id="discussion"></textarea></div><div class="full"><label>Key Requirement / Problem</label><textarea id="problem"></textarea></div><div class="full"><label>Next Step</label><textarea id="next"></textarea></div><div><label>Follow-up Date</label><input id="follow" type="date"></div><div><label>Additional Notes</label><input id="notes"></div></div><div id="sm"></div><div class="actions"><button type="button" class="secondary" onclick="home()">Cancel</button><button class="primary">Save Meeting</button></div></form></div></section><section id="detail" class="hidden"><div class="card"><button class="secondary" onclick="home()">← Back</button><div id="dc" style="margin-top:14px"></div></div></section></div>
<script>const CONFIG={API_URL:'https://script.google.com/macros/s/AKfycbx5DLf-R0tbnQdrzH5A32vXhsbpN_AmcxBTlssTX1b-siE1pPykOVt2l1Aahl8reiSf/exec',ME:'1106',NOMAN:'2722'};let s=JSON.parse(localStorage.getItem('buzzSession')||'null'),ms=[];function login(){let p=document.getElementById('pass').value,k=p===CONFIG.ME?'Me':p===CONFIG.NOMAN?'Noman':'';if(!k){le.textContent='Incorrect passcode.';return}s={user:k,passcode:p};localStorage.setItem('buzzSession',JSON.stringify(s));open()}function logout(){localStorage.removeItem('buzzSession');location.reload()}function open(){loginEl.classList.add('hidden');app.classList.remove('hidden');who.textContent='Signed in as '+s.user;home();load()}const loginEl=document.getElementById('login'),app=document.getElementById('app');function hide(){['form','detail'].forEach(x=>document.getElementById(x).classList.add('hidden'));homeEl.classList.remove('hidden')}const homeEl=document.getElementById('home');function home(){document.getElementById('form').classList.add('hidden');document.getElementById('detail').classList.add('hidden');homeEl.classList.remove('hidden');render()}function formView(){homeEl.classList.add('hidden');detail.classList.add('hidden');form.classList.remove('hidden');date.value=new Date().toISOString().slice(0,10)}async function api(action,data={}){if(CONFIG.API_URL.includes('PASTE_'))throw Error('Google Apps Script URL is not configured.');let r=await fetch(CONFIG.API_URL,{method:'POST',body:JSON.stringify({action,...data})});return r.json()}async function load(){status.textContent='Syncing...';try{let r=await api('list',{passcode:s.passcode});if(!r.ok)throw Error(r.error);ms=r.meetings||[];status.textContent=ms.length+' meeting'+(ms.length===1?'':'s');render()}catch(e){status.innerHTML='<span class="error">Sync error: '+esc(e.message)+'</span>';render()}}function render(){let q=(search.value||'').toLowerCase(),f=filter.value;let a=ms.filter(m=>(!q||((m.businessName||'')+' '+(m.personMet||'')).toLowerCase().includes(q))&&(!f||m.metBy===f)).sort((x,y)=>String(y.meetingDate).localeCompare(String(x.meetingDate)));list.innerHTML=a.length?'':'<div class="card empty">No meetings found.</div>';a.forEach(m=>{let d=document.createElement('div');d.className='card meeting';d.onclick=()=>detailView(m);d.innerHTML='<h3>'+esc(m.businessName)+'</h3><div class="muted">'+esc(m.personMet||'No person recorded')+' · '+esc(m.meetingDate||'No date')+'</div><span class="pill">'+esc(m.metBy||'')+'</span>'+ (m.nextStep?'<span class="pill">Next step set</span>':'');list.appendChild(d)})}function detailView(m){homeEl.classList.add('hidden');form.classList.add('hidden');detail.classList.remove('hidden');dc.innerHTML='<h1>'+esc(m.businessName)+'</h1><div class="muted">'+esc(m.meetingDate||'')+' · Met by '+esc(m.metBy||'')+'</div>'+[['Person Met',m.personMet],['Contact',m.contact],['Other Contact',m.otherContact],['What Was Discussed',m.discussion],['Key Requirement / Problem',m.problem],['Next Step',m.nextStep],['Follow-up Date',m.followUp],['Additional Notes',m.notes]].map(x=>x[1]?'<div style="margin:15px 0"><div class="muted">'+x[0]+'</div><div style="white-space:pre-wrap;margin-top:4px">'+esc(x[1])+'</div></div>':'').join('')}async function save(e){e.preventDefault();sm.textContent='Saving...';let m={businessName:business.value,personMet:person.value,contact:contact.value,otherContact:other.value,metBy:met.value,meetingDate:date.value,discussion:discussion.value,problem:problem.value,nextStep:next.value,followUp:follow.value,notes:notes.value};try{let r=await api('create',{passcode:s.passcode,meeting:m});if(!r.ok)throw Error(r.error);ms.unshift(r.meeting);sm.innerHTML='<span class="success">Saved and synced.</span>';setTimeout(home,400)}catch(e){sm.innerHTML='<span class="error">'+esc(e.message)+'</span>'}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}if(s)open();</script></body></html>
